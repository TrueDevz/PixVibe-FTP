<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Inner Soft Hex Shadow -->
  <rect x="40" y="40" width="432" height="432" rx="84" fill="#090d16" opacity="0.6" />

  <!-- Transmitter Waves -->
  <path d="M120 180 A120 120 0 0 1 392 180" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.25" />
  <path d="M150 200 A90 90 0 0 1 362 200" stroke="#818cf8" stroke-width="6" stroke-linecap="round" opacity="0.4" />

  <!-- PixVibe P & V Monogram / Lightning Arrow -->
  <g filter="url(#glow)">
    <!-- Main Lightning / High-Speed Transfer Core -->
    <path d="M280 60 L140 270 L250 270 L210 450 L380 230 L280 230 L330 60 Z" fill="url(#boltGrad)" />
    
    <!-- Stylized 'V' Chevron cut in the bottom -->
    <path d="M210 450 L320 310 L260 310 Z" fill="url(#accentGrad)" opacity="0.8" />

    <!-- Stylized 'P' top curve loop -->
    <path d="M250 110 C320 110 340 160 310 190 C280 220 230 220 230 220" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.3" fill="none" />
  </g>

  <!-- Center Pulse Dot -->
  <circle cx="280" cy="230" r="8" fill="#ffffff" />
</svg>
